appId: co.eris.taliesin
productName: Taliesin
# The 1024px master, build-time only: electron-builder generates the app icons
# from it. It lives in build/ (directories.buildResources), which is never
# packaged -- in resources/ it would ship despite nothing reading it at run time.
icon: build/icon.png
# Turn off the escape hatches built into the shipped Electron binary. These land
# on the PACKAGED binary only, so nothing in CI or the e2e suite exercises them
# -- see SECURITY.md for the manual check. Native electron-builder config, never
# an afterPack hook: mac.target below is a UNIVERSAL dmg, and a per-arch hook
# corrupts the merge with an "identical SHAs" failure. See the document repo's
# ecosystem-rollout-checklist.md R-006 part 4.
electronFuses:
  # ELECTRON_RUN_AS_NODE turns the app into a plain Node interpreter that will
  # run whatever it is handed. Off, this variable becomes inert -- which also
  # makes a failed launch honest rather than a silent exit 0.
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  # Refuse to load app code from anywhere but the asar. Settled house-wide as
  # compatible with an asarUnpack tree (epona, 2026-07-31), so `resources/**`
  # below is unaffected.
  onlyLoadAppFromAsar: true
  # Flipping fuses rewrites the Electron Framework binary and invalidates its
  # ad-hoc signature, which is mandatory on Apple Silicon; re-apply it before
  # the real signing step in release.yml.
  resetAdHocDarwinSignature: true
directories:
  buildResources: build
# An ALLOWLIST, not the scaffold's denylist. electron-builder includes the whole
# project directory by default and `files` subtracts from it, so a denylist leaks
# every time a new top-level directory appears -- .claude, coverage, docs, e2e,
# scripts and the tsconfig/*.tsbuildinfo files were all shipping inside app.asar
# because they postdate the scaffold's list. Naming what belongs instead means
# the next new directory is excluded by default. Anything added here shows up in
# `npx asar list dist/win-unpacked/resources/app.asar`, which is the only
# reliable check. See the document repo's ecosystem-rollout-checklist.md R-005.
#
# `build/` needs no entry: it is directories.buildResources and never packaged.
files:
  - 'out/**'
  - 'resources/**'
  - 'package.json'
  # Rendered in-app by the "What's new" dialog, so it is a runtime asset here
  # rather than repo documentation. Main reads it from the app root, next to
  # package.json (see readChangelog in src/main/handlers.ts).
  - 'CHANGELOG.md'
asarUnpack:
  - resources/**
win:
  executableName: taliesin
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  # Predictable name for the release workflow's sign + upload steps. The default
  # is "Taliesin Setup <version>.exe", with spaces, which every path in that
  # workflow would then have to quote.
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Assisted rather than one-click, and per-user rather than per-machine. The
  # three settle together and match epona, which is the closest sibling by
  # audience:
  #   * oneClick: false gives a wizard rather than an install that starts on
  #     double-click. This tool sits beside a Dark Ages install and a world
  #     repository, so where it goes is a decision the user may want to make.
  #   * perMachine: false installs under the user profile, so there is no UAC
  #     prompt and no administrator requirement. It also agrees with where the
  #     app already keeps its data: %LOCALAPPDATA%\Erisco\Taliesin.
  #   * allowToChangeInstallationDirectory only has an effect when oneClick is
  #     false; NSIS has no directory page to offer in a one-click install.
  # Changing perMachine after a release is the expensive one: an existing
  # per-user installation is not upgraded by a per-machine installer, and the
  # user ends with two.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # NO `splashImage`, on purpose (HTOO-466). With one, the NSIS stub runs in GUI
  # mode: it paints the bitmap, hides its own "Setup" dialog, extracts, runs the
  # app, and -- when the app exits -- re-shows that hidden dialog for its
  # completion step before `AutoCloseWindow` closes it. That re-show is a blank
  # window that flashes after the app's own window has gone, on every close of
  # the portable exe. There is no hook to stop it: electron-builder reads
  # `portable.nsi` verbatim for this target.
  #
  # Without it the stub runs `SetSilent silent` and owns no window. The cost is a
  # busy cursor, and no image, while the stub extracts the app to %TEMP% on each
  # launch. The in-app splash (`resources/splash.html`) covers everything from
  # electron's first frame on. Do not add the image back to fill that gap: it is
  # the flash's cause. The template, oghma, mabon, balor and creidhne made the
  # same change. scripts/portable-config.test.mjs pins the absence.
  #
  # Extract to a directory unique to each LAUNCH, not to each BUILD (HTOO-351,
  # fault 2). Left unset, electron-builder bakes one KSUID into the exe at build
  # time, so every copy of a build extracts to the same $TEMP<ksuid>. A second
  # launch then runs `RMDir /r` on the directory the RUNNING copy executes from
  # and copies over its locked files, which ends in NSIS's own "Taliesin cannot
  # be closed" Retry/Cancel box. With a directory per launch, the second copy
  # reaches Electron, loses requestSingleInstanceLock and exits, and the first
  # window comes forward.
  #
  # TRUE, not the documented `false`. app-builder-lib 26.17.0 resolves this as
  #   if (typeof unpackDirName === "string" || !unpackDirName)
  #     defines.UNPACK_DIR_NAME = unpackDirName || generateKsuid()
  # so `false` takes the branch and still gets a build-time KSUID. Only a truthy
  # non-string leaves UNPACK_DIR_NAME undefined, and portable.nsi then falls back
  # to $PLUGINSDIRapp, which NSIS makes unique per process. Do not "correct"
  # this to `false`. Creidhne measured it (HTOO-351).
  #
  # The cost: a killed stub's folder has a name no later launch reuses, so
  # src/main/portableSweep.ts removes it (HTOO-494).
  unpackDirName: true
mac:
  category: public.app-category.developer-tools
  # macOS gets its OWN artwork, not the shared `icon` above. Its icon is a
  # rounded square on Apple's 824-in-1024 grid, and the OS does not mask it, so
  # the corners have to be transparent in the file itself. Generated from the document repo's
  # mac-specific master by `node scripts/make-mac-icon.mjs`, which also
  # reconstructs the alpha channel that master is exported without -- see that
  # script's header. build/icon-mac.png beside this is the 1024px RGBA result.
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
      arch:
        - universal
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # MUST be explicit, and must be a DIRECTORY.
  #
  # electron-builder resolves the Linux icon as [linux.icon, mac.icon ?? icon]
  # (app-builder-lib LinuxTargetHelper.js), so mac.icon OUTRANKS the top-level
  # icon above. Leaving this unset shipped the macOS artwork on Linux --
  # measured in taliesin_2.9.0_amd64.deb, not read off this file.
  #
  # A single PNG is also never resampled (iconConverter.js): one PNG in, one
  # hicolor entry out, at its own size. hicolor's index.theme stops at 512, so
  # pointing this at a 1024 master gives a directory nothing indexes and the
  # desktop draws its generic blank document instead.
  #
  # Those two together are why the naive fix makes THIS repo worse. Taliesin is
  # one of only two house apps currently shipping a full eight-size set, because
  # the .icns fallback happens to contain one -- the wrong picture at the right
  # sizes. Repointing at a raster master without generating a set first would
  # take it from wrong-but-visible to blank.
  #
  # The set descends from the macros tile, which is the macOS/Linux artwork --
  # NOT build/icon.png, which is the Windows one. Full-bleed already, so nothing
  # is cropped. Regenerate with:
  #   node scripts/make-linux-icons.mjs
  icon: build/icons
  # A correct hicolor set is only half of it, and this is the half that gets
  # missed: oghma shipped the right sizes and still showed a generic taskbar
  # icon. Electron derives its app_id / WM_CLASS from package.json's
  # `desktopName` (taliesin.desktop -> "taliesin"), while electron-builder writes
  # StartupWMClass into the .desktop entry from productName ("Taliesin") when
  # this is unset. That case mismatch stops a desktop environment linking the
  # running window to the installed entry, however correct build/icons/ is.
  # Defaults to false in electron-builder 26 and becomes true in 27.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: Caeldeth
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: hybrasyl
  repo: taliesin
