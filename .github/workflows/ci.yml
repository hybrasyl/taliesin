name: CI

# Split out of release.yml, which carried the only gate this repo had. Two
# reasons it belongs in its own file: release.yml fires on a `v*` tag, so its
# PR trigger was doing unrelated work in a workflow named "Release", and a
# tag-triggered run cannot usefully cancel in-flight while a CI run can.
# MANUAL ONLY (HTOO-390). GitHub bills windows runners at 2x and macOS at 10x,
# and this workflow ran on every pull request and every push -- so a change was
# checked twice, once on the PR and again on the merge commit. One day of that
# across the house on 2026-08-12 exhausted the shared Actions allowance and the
# account hit its spending limit mid-merge.
#
# What replaces it, because "run it locally" is only a plan if something makes
# it happen: "npm run validate" via .githooks/pre-push, armed by the "prepare"
# script setting core.hooksPath -- no husky, no new dependency. And
# "npm run validate:linux" runs the same suite on real Linux through WSL, for
# the platform a Windows dev box cannot cover.
#
# release.yml is untouched: it still validates at tag time and still builds the
# macOS and Linux artifacts, which cannot be built on the dev box at all.
#
# WHAT IS LOST, rather than glossed: a hosted runner is a DIFFERENT machine from
# the dev box, and on oghma it twice caught what the dev box could not -- the
# runner ships core.autocrlf=true, and its file-time clock advances about every
# 15 ms where a dev box's is finer. Fire this by hand before a release or a
# platform-shaped change:
#   gh workflow run ci.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push cancels the in-flight run for the same branch/PR. Safe here and
  # wasteful nowhere -- unlike release.yml, a cancelled check loses nothing.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # No native addon, so ubuntu is fine and finishes faster than windows.
    runs-on: ubuntu-latest

    steps:
      # DEPTH 1, deliberately, and this is the recorded answer to HTOO-328 for
      # this repo rather than an unexamined default.
      #
      # A shallow clone records no parents, so every commit CI sees reads as a
      # ROOT commit: nothing is ever a merge and ancestry questions answer
      # confidently and wrongly. That silently voided an e2e assertion in balor,
      # which reads commit parents.
      #
      # Nothing in Taliesin reads git. No source, script, test or e2e spec shells
      # out to it or parses its output; scripts/changelog-extract.mjs reads
      # CHANGELOG.md, and release.yml's `generate_release_notes` is computed by
      # GitHub from the API rather than from the clone. So a deeper fetch would
      # buy nothing and cost a full clone on every run.
      #
      # Revisit this the moment anything here reads parents, merge-base,
      # ahead/behind or `git describe` -- at that point the default stops being
      # free and starts being a wrong answer.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --max-warnings 0 lives in the script, not here, so `npm run lint:check`
      # means the same thing locally and in CI.
      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:coverage

      # Production dependencies only, high and above. Both narrowings are
      # load-bearing: eslint and electron-builder do not ship, so an advisory in
      # one is something to schedule rather than something that should red an
      # unrelated PR. A gate that cries wolf gets deleted, and then there is no
      # gate. The dev tree is handled by hand -- see SECURITY.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # The Playwright/Electron specs drive the BUILT app. They are slower than the
  # unit suite and fail for different reasons, so they run as their own job to
  # keep the lint/typecheck/test signal fast and separable.
  #
  # WHY THIS JOB EXISTS. Two specs guard invariants that NOTHING else can fail:
  #   - ipc-guard: building the trusted-location list with string concatenation
  #     instead of pathToFileURL refuses every IPC and the app is dead on
  #     arrival. It typechecks, lints and builds clean.
  #   - preload-sandbox: a package import in src/preload/index.ts breaks
  #     `sandbox: true` in the PACKAGED app only. Also clean everywhere else.
  # Until now both were checked on a maintainer's machine or not at all.
  #
  # WHY WINDOWS AND NOT UBUNTU + XVFB. Not a preference, and not (as elsewhere in
  # the house) a native addon -- this repo has none. src/main/index.ts resolves
  # the userData directory from %LOCALAPPDATA% on win32 and from
  # app.getPath('appData') everywhere else, so the LOCALAPPDATA redirect that
  # makes e2e/helpers.js hermetic is a NO-OP off Windows: the specs would read
  # and write the runner's real profile, and settings-persistence -- which seeds
  # a settings.json into that temp dir and expects the app to load it -- would
  # fail outright. windows-latest matches release.yml's Windows build job.
  e2e:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No `playwright install`: these specs launch the app's own Electron
      # binary through Playwright's _electron API and never open a browser.
      # `npm run e2e` builds first -- the specs load out/main/index.js.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
