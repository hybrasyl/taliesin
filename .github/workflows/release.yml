name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# No FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 env. It was here for one holdout,
# sslcom/esigner-codesign (`using: node20`). That action is gone (HTOO-517):
# build-windows runs CodeSignTool itself. Every action left runs on node24.

jobs:
  # Re-runs the PR gate on the tag itself, so a release can never be cut from a
  # commit that does not pass. ci.yml is the same gate on every PR and every
  # push to main; this one exists because a tag is neither.
  validate:
    runs-on: ubuntu-latest

    steps:
      # Depth 1 everywhere in this workflow, deliberately -- see the note on the
      # checkout step in ci.yml for the reasoning (HTOO-328). Nothing in this
      # repo reads git history, including the release notes: changelog-extract
      # reads CHANGELOG.md, and `generate_release_notes` is computed by GitHub
      # from the API rather than from the clone.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Test + coverage gate
        run: npm run test:coverage

  build-windows:
    runs-on: windows-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # No target list here, so the Windows targets live in electron-builder.yml
      # and nowhere else. That file has declared BOTH nsis and portable since
      # WP14; this step named one of the two, so it quietly built one of them and
      # every release shipped without an installer. Balor hit the identical
      # defect and published four assets where five were configured (HTOO-244).
      # A target list in two places is a target list that disagrees with itself,
      # and the config is the half a reader checks.
      #
      # scripts/release-artifacts.test.mjs enforces the absence of a target list
      # here, and pins these targets against the release job's globs in both
      # directions.
      - name: Package installer + portable exe
        run: npx electron-builder --win --publish never

      # The half of the fuse check that only a packaged artifact can answer. The
      # config test in the PR gate proves electron-builder was ASKED; this proves
      # it did it. Reads the wire off the unpacked exe, which is what BOTH
      # artifacts wrap: the portable exe is an NSIS self-extracting stub around
      # this directory, and the installer writes it to disk.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs dist/win-unpacked/taliesin.exe

      - name: Resolve artifact version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # WINDOWS SIGNING: CodeSignTool on a CURRENT JDK, never its bundled one
      # (HTOO-517, the mabon shape, as oghma and creidhne).
      #
      # Every CodeSignTool release (v1.3.2 is the newest) bundles JDK 11.0.2 from
      # 2019, and its CodeSignTool.bat always runs that JDK. On 2026-09-30 SSL.com
      # renewed the certificate of login.ssl.com, the OAuth host CodeSignTool
      # signs in at. The new chain ends at "SSL.com TLS RSA Root CA 2022" with no
      # cross-signed copy, and the old trust store does not have that root: every
      # sign fails with `PKIX path building failed`. sslcom/esigner-codesign,
      # which this job used before, runs the bundled JDK. Temurin 17 has the root.
      #
      # No `if:` guard on the secrets. Taliesin has always signed
      # unconditionally, so a run without the ES_* secrets fails. It does not
      # publish unsigned files.
      - name: Set up Java 17 for CodeSignTool
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ONE step signs BOTH artifacts, so they are signed together or not at all.
      # Signing one and not the other is worse than signing neither: a user
      # handed a signed installer beside an unsigned portable exe cannot read
      # that as "credentials are configured for one artifact". Any failure stops
      # the job before the upload. release-artifacts.test.mjs requires that this
      # step names each Windows target, so a third .exe that this step does not
      # sign fails on a commit, not on a tag.
      #
      # Only these two outer files are signed. electron-builder.yml configures no
      # Windows signing, so the app exe and the uninstaller inside them are not
      # signed.
      #
      # CodeSignTool is pinned (as in epona, mabon and oghma): the eSigner
      # protocol has changed between releases. It reads conf/ from its working
      # directory, so it runs in its own folder. -output_dir_path stops it from
      # asking whether to replace the input. That prompt would wait until the job
      # times out.
      #
      # CodeSignTool can print an error and still exit 0, and write no file. Thus
      # the step reads each signature back and requires the status `Valid`.
      - name: Sign installer + portable exe (SSL.com eSigner)
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODESIGNTOOL_VERSION: '1.3.2'
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "${{ github.workspace }}/dist/taliesin-${{ steps.version.outputs.version }}-setup.exe",
            "${{ github.workspace }}/dist/taliesin-${{ steps.version.outputs.version }}-portable.exe"
          )
          $archive = "CodeSignTool-v$env:CODESIGNTOOL_VERSION-windows.zip"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v$env:CODESIGNTOOL_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/$archive" -UseBasicParsing
          Expand-Archive -Path "$env:RUNNER_TEMP/$archive" -DestinationPath "$env:RUNNER_TEMP/codesigntool" -Force
          $jar = Get-ChildItem "$env:RUNNER_TEMP/codesigntool" -Recurse -Filter 'code_sign_tool-*.jar' | Select-Object -First 1
          if (-not $jar) { throw "no code_sign_tool jar in $archive" }
          $toolDir = $jar.Directory.Parent.FullName
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          & $java -version
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "not found: $file" }
            $out = Join-Path $env:RUNNER_TEMP 'esigner-output'
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Push-Location $toolDir
            try {
              & $java -jar $jar.FullName sign "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" "-credential_id=$env:ES_CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" "-input_file_path=$file" "-output_dir_path=$out" "-override=true"
              if ($LASTEXITCODE -ne 0) { throw "CodeSignTool exited $LASTEXITCODE for $file" }
            } finally {
              Pop-Location
            }
            $signed = Join-Path $out (Split-Path $file -Leaf)
            if (-not (Test-Path $signed)) { throw "CodeSignTool wrote no signed file for $file" }
            Move-Item -Force $signed $file
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "signature on $file is $($sig.Status)" }
            Write-Host "signed: $file ($($sig.SignerCertificate.Subject))"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          # Both, and `if-no-files-found: error` now covers both -- the setup exe
          # is named by `nsis.artifactName` in electron-builder.yml, so a rename
          # there fails this step rather than silently shipping one artifact.
          # The `.blockmap` electron-builder writes beside the installer is not
          # collected: it exists for electron-updater's differential download,
          # and this app has no updater (HTOO-65 notifies and downloads nothing).
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
          if-no-files-found: error
          # The release job consumes this minutes later and the published
          # Release keeps its own copy, which does not count against Actions
          # storage. At the 90-day default, three releases exhausted the quota
          # on oghma and every build job failed to upload, publishing nothing.
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Linux AppImage + deb
        run: npx electron-builder --linux --publish never

      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs dist/linux-unpacked/taliesin

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 1

  build-mac:
    runs-on: macos-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # Set up our own signing keychain (rather than electron-builder's
      # CSC_LINK throwaway) so the post-build dmg codesign can reach the
      # same Developer ID identity. electron-builder auto-discovers it.
      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          # Make our keychain searchable/default for the toolchain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        id: asc
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # electron-builder signs + notarizes + staples the .app (auto-discovers
      # the identity from our keychain), then wraps it in the dmg.
      - name: Package, sign + notarize app
        run: npx electron-builder --mac --publish never
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Both slices, not one. The dmg is `arch: universal`, so the .app carries a
      # fuse wire per architecture and a verifier that reads the first sentinel
      # only would pass an artifact whose arm64 half was never flipped — see the
      # header of the script.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs dist/mac-universal/Taliesin.app

      # The dmg itself is unsigned/un-notarized out of electron-builder, so a
      # downloaded dmg would trip Gatekeeper. Sign, notarize + staple it too.
      - name: Sign, notarize + staple the dmg
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DMG="dist/taliesin-${VERSION}.dmg"
          codesign --force --timestamp \
            --sign "Developer ID Application: ERISCO LLC (D4Q96JRVKU)" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-mac]
    if: github.ref_type == 'tag'

    steps:
      # Checkout (the release job otherwise only downloads artifacts) so the
      # CHANGELOG + extract script are on disk.
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Pull this tag's section from CHANGELOG.md into the release body. Missing
      # section → empty file → the release falls back to the auto notes below.
      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-extract.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # One glob per target declared in electron-builder.yml. The two lists
          # are pinned against each other, in both directions, by
          # scripts/release-artifacts.test.mjs -- a glob with no target behind it
          # would make `fail_on_unmatched_files: true` red on every release,
          # which is the most expensive moment to find one.
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-portable.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
          # Curated CHANGELOG section on top; generate_release_notes appends the
          # auto PR list + Full Changelog link below it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Notify Discord
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**Taliesin $TAG** is now available!\n$RELEASE_URL\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
      # The house version manifest (versions.json in hybrasyl/cernunnos, update-check
      # module v1) is NOT written here. That write is a commit and push by the
      # developer who releases, with their own git access: the workflow has no
      # credential for cernunnos, by decision. Running apps learn of this release only
      # after that step, so this step prints the command on the run page (a notice)
      # and in the job summary.
      - name: Remind to publish the version manifest
        if: success()
        run: |
          CMD="npm run publish:version -- ${{ github.ref_name }}"
          echo "::notice title=Publish the version manifest::Start the packaged app, then run: $CMD"
          {
            echo "### Next: publish the version manifest"
            echo
            echo "Start the packaged app from the release. Then run this in the app checkout:"
            echo
            echo "    $CMD"
            echo
            echo "Running copies of the app do not see this release until you do."
          } >> "$GITHUB_STEP_SUMMARY"
